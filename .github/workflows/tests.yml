name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build, unit, rules and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install LibreOffice Calc and openpyxl (Excel parity test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-openpyxl

      - name: Install dependencies
        run: npm ci

      - name: Build site and rules
        run: npm run build

      - name: Export structure and Excel formula parity
        run: npm test
        env:
          RECALC: tools/recalc.py

      - name: Firestore security rules (emulator)
        run: npm run test:rules

      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium

      - name: Browser walk-through
        run: npm run test:ui
        env:
          DTH_TMP: ${{ runner.temp }}/dth-ui

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/dth-ui
          if-no-files-found: ignore
          retention-days: 7
